<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Messy data flowing through a pipeline into a clean trend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f1b33"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f6feb" stop-opacity=".45"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></linearGradient>
    <linearGradient id="fun" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f6feb" stop-opacity=".02"/><stop offset="1" stop-color="#58a6ff" stop-opacity=".22"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1000" height="260" rx="14"/></clipPath>
    <clipPath id="reveal"><rect x="590" y="0" width="360" height="260"><animate attributeName="width" values="0;360;360" keyTimes="0;.55;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <style>
    .dot { fill: var(--c); opacity: 0; animation: flow 6s cubic-bezier(.45,.05,.4,1) infinite; }
    @keyframes flow {
      0%   { transform: translate(0,0); opacity: 0; fill: var(--c); }
      8%   { opacity: .9; }
      40%  { transform: translate(var(--mx), var(--my)); fill: var(--c); opacity: .9; }
      46%  { transform: translate(var(--mx), var(--my)); fill: #58a6ff; opacity: .9; }
      80%  { transform: translate(var(--ex), var(--ey)); fill: #58a6ff; opacity: 1; }
      94%  { transform: translate(var(--ex), var(--ey)); fill: #58a6ff; opacity: 1; }
      100% { transform: translate(var(--ex), var(--ey)); fill: #58a6ff; opacity: 0; }
    }
    .gate { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
    .scan { animation: scan 1.6s linear infinite; }
    @keyframes scan { from { transform: translateY(-46px); } to { transform: translateY(46px); } }
    .drift { animation: drift 14s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-40px); } }
    .fade { animation: fade 6s ease-in-out infinite; }
    @keyframes fade { 0%,40% { opacity: 0; } 70%,92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dot { opacity: .8; } }
  </style>
