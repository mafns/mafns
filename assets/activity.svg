<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<style>
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0}to{opacity:1}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .s{animation:rise .6s ease-out both}
  .c{animation:pop .5s ease-out both}
  .bar{transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both .4s}
  .live{animation:pulse 2s ease-in-out infinite}
</style>
<defs><linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#1f6feb" stop-opacity=".0"/><stop offset=".5" stop-color="#1f6feb" stop-opacity=".55"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></linearGradient><clipPath id="barclip"><rect x="32" y="210" width="796" height="8" rx="4"/></clipPath></defs>
