name: Update profile stats

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub's minimum; it may run less often when busy
  push:
    branches: [main]           # bot commits don't re-trigger this, so no loops
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-stats]     # other repos can ping this for an instant refresh

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Activity card
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_FILE: assets/activity.svg
        run: python scripts/activity.py

      - name: Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Commit
        run: |
          mkdir -p games
          mv dist/*.svg games/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets games
          git diff --cached --quiet && exit 0
          # Cache-bust: new ?v= on every change so GitHub can't show stale images
          V=$(date +%s)
          sed -i -E "s#(assets/activity\.svg|games/pacman-contribution-graph-dark\.svg)(\?v=[0-9]+)?#\1?v=$V#g" README.md
          git add README.md
          git commit -m "chore: update profile stats"
          git pull --rebase origin main
          git push
