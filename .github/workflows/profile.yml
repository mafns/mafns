name: Update profile stats

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub's minimum; it may run less often when busy
  push:
    branches: [main]           # bot commits don't re-trigger this, so no loops
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-stats]     # other repos can ping this for an instant refresh

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Streak card
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_FILE: assets/streak.svg
        run: python scripts/streak.py

      - name: Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit
        run: |
          mkdir -p games
          mv dist/*.svg games/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets games profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile stats"
          git pull --rebase origin main
          git push
